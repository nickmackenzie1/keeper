services:
  keeper:
    # Built right here on the NAS from this folder (Dockerfile + server/ + web/).
    # Auto-update option: see "Auto-update (optional)" in README.md.
    build:
      context: .
      args:
        KEEPER_VERSION: ${KEEPER_VERSION:-dev}
    image: keeper-local
    container_name: keeper
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    volumes:
      # keeper.db lives here — include this folder in Hyper Backup.
      - /volume1/docker/keeper/data:/data

  # Cloudflare Tunnel: the NAS dials OUT to Cloudflare, so no router ports are opened.
  # In Cloudflare, the route's service URL is:  http://localhost:8787
  # (host networking: the tunnel reaches Keeper exactly like the NAS itself does).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: keeper-tunnel
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - keeper
